# Configuración del cluster link madrid -> valencia (se crea en el DESTINO)
bootstrap.servers=madrid:29092

# Sincronizar los offsets confirmados de los grupos de consumidores (para el failover)
consumer.offset.sync.enable=true
consumer.offset.sync.ms=5000
consumer.offset.group.filters={"groupFilters":[{"name":"*","patternType":"LITERAL","filterType":"INCLUDE"}]}

# Sincronizar configuraciones de topic cada 5 s (por defecto, 5 minutos)
topic.config.sync.ms=5000

# En este laboratorio no hay ACLs que sincronizar
acl.sync.enable=false
