# MirrorMaker 2 en modo dedicado: replica madrid -> valencia
clusters = madrid, valencia
madrid.bootstrap.servers = madrid:29092
valencia.bootstrap.servers = valencia:29092

madrid->valencia.enabled = true
madrid->valencia.topics = flota\\.vehiculos
madrid->valencia.groups = .*
valencia->madrid.enabled = false

# Traducción y sincronización de offsets de consumidores
emit.checkpoints.enabled = true
emit.checkpoints.interval.seconds = 5
sync.group.offsets.enabled = true
sync.group.offsets.interval.seconds = 5
sync.topic.acls.enabled = false

# Un solo broker por clúster: todos los topics internos con RF 1
replication.factor = 1
checkpoints.topic.replication.factor = 1
heartbeats.topic.replication.factor = 1
offset-syncs.topic.replication.factor = 1
offset.storage.replication.factor = 1
status.storage.replication.factor = 1
config.storage.replication.factor = 1
