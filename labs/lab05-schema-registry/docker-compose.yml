# =============================================================================
# Lab 5 · Schema Registry: compatibilidad, cambios rechazados y administración
#
#  kafka1             Confluent Server KRaft (un nodo, entorno ligero)
#  schema-registry    nodo principal de Schema Registry          -> http://localhost:8081
#  schema-registry-2  segundo nodo (perfil "ha", opcional)        -> http://localhost:8082
# =============================================================================
name: kafka-lab05

x-kafka-ligero: &kafka-ligero
  image: confluentinc/cp-server:7.9.0
  hostname: kafka1
  container_name: kafka1
  volumes:
    - ../../comun/scripts:/scripts:ro
  environment:
    CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    KAFKA_NODE_ID: 1
    KAFKA_PROCESS_ROLES: "broker,controller"
    KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka1:29093"
    KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
    KAFKA_LISTENERS: "PLAINTEXT://kafka1:29092,CONTROLLER://kafka1:29093,HOST://0.0.0.0:9092"
    KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka1:29092,HOST://localhost:9092"
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT"
    KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
    KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    KAFKA_DEFAULT_REPLICATION_FACTOR: 1
    KAFKA_MIN_INSYNC_REPLICAS: 1
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    KAFKA_CONFLUENT_LICENSE_TOPIC_REPLICATION_FACTOR: 1
    KAFKA_CONFLUENT_BALANCER_TOPIC_REPLICATION_FACTOR: 1
    KAFKA_CONFLUENT_BALANCER_ENABLE: "false"
    KAFKA_CONFLUENT_SUPPORT_METRICS_ENABLE: "false"
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
  ports:
    - "9092:9092"

x-sr-env: &sr-env
  SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "PLAINTEXT://kafka1:29092"
  SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"
  SCHEMA_REGISTRY_KAFKASTORE_TOPIC: "_schemas"
  SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
  SCHEMA_REGISTRY_SCHEMA_REGISTRY_GROUP_ID: "schema-registry-formacion"
  SCHEMA_REGISTRY_LEADER_ELIGIBILITY: "true"
  SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: "backward"
  SCHEMA_REGISTRY_MODE_MUTABILITY: "true"
  SCHEMA_REGISTRY_HEAP_OPTS: "-Xms256m -Xmx256m"

services:
  kafka1:
    <<: *kafka-ligero

  schema-registry:
    image: confluentinc/cp-schema-registry:7.9.0
    hostname: schema-registry
    container_name: schema-registry
    depends_on: [kafka1]
    ports:
      - "8081:8081"
    volumes:
      - ./schemas:/schemas:ro
    environment:
      <<: *sr-env
      SCHEMA_REGISTRY_HOST_NAME: "schema-registry"

  schema-registry-2:
    image: confluentinc/cp-schema-registry:7.9.0
    hostname: schema-registry-2
    container_name: schema-registry-2
    profiles: ["ha"]
    depends_on: [kafka1]
    ports:
      - "8082:8081"
    environment:
      <<: *sr-env
      SCHEMA_REGISTRY_HOST_NAME: "schema-registry-2"
