global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: kafka
    static_configs:
      - targets: ["kafka1:7071", "kafka2:7071", "kafka3:7071"]
    relabel_configs:
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: instance
        replacement: "$1"

  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]
