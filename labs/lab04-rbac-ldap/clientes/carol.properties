# Usuario LDAP "carol" · SASL/PLAIN validado contra LDAP por el broker
# (en producción, siempre SASL_SSL: PLAIN envía la contraseña tal cual)
security.protocol=SASL_PLAINTEXT
sasl.mechanism=PLAIN
sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="carol" password="carol-secret";
