# Administrador: se autentica con certificado (mTLS) en el listener BROKER (29092).
# Su principal será User:admin gracias a ssl.principal.mapping.rules (CN=admin -> admin).
security.protocol=SSL
ssl.truststore.location=/secrets/kafka.truststore.jks
ssl.truststore.password=confluent
ssl.keystore.location=/secrets/admin.keystore.jks
ssl.keystore.password=confluent
ssl.key.password=confluent
