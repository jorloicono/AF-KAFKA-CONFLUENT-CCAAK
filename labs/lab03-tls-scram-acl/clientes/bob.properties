# Usuario bob: SASL/SCRAM-SHA-512 sobre TLS en el listener CLIENT (19092)
security.protocol=SASL_SSL
sasl.mechanism=SCRAM-SHA-512
sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="bob" password="bob-secret";
ssl.truststore.location=/secrets/kafka.truststore.jks
ssl.truststore.password=confluent
